id: page.codeberg.elly_code.inscriptions
# elementary SDK is not available on Flathub, so use the elementary BaseApp instead
base: io.elementary.BaseApp
base-version: tanit-26.08
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: page.codeberg.elly_code.inscriptions

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  # Required for communication with external API
  - --share=network

cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/vala

# Cleanup development-related files inherited from the BaseApp to reduce package size of your app.
cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: inscriptions
    buildsystem: meson
    config-opts:
      # Flathub strips debug symbols into a separate extension
      - --buildtype=debugoptimized
    sources:
      - type: git
        url: https://codeberg.org/elly-code/inscriptions.git
        tag: 1.2.1
        commit: 6f5016cfb5f304df13bc5318111525da407179ba
        # Flathub's auto update bot
        x-checker-data:
          type: git
          tag-pattern: '^\d+.\d+.\d+$'
          sort-tags: false
